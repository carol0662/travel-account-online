# wrangler.toml — Cloudflare Pages 本地开发 / 配置参考
# 通过 Cloudflare 控制台（Git 集成）部署时，构建配置在控制台设置：
#   构建命令：留空   构建输出目录：public
# D1 数据库绑定在控制台「设置 → Functions → D1 数据库绑定」里添加（绑定名 DB）。
# 下面 database_id 仅本地开发需要，部署时可不填。

name = "travel-account-online"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# D1 数据库绑定：已在 Cloudflare 控制台 Settings → Bindings 配置（变量名 DB → travel-db）
# 下面配置仅本地 wrangler dev 使用；Pages 部署不需要（控制台绑定优先）。
# 如需本地开发，先执行 `wrangler d1 create travel-db` 拿到真实 database_id 后取消注释。
# [[d1_databases]]
# binding = "DB"
# database_name = "travel-db"
# database_id = "<从 wrangler d1 create 输出中复制的真实 UUID>"
