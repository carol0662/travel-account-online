# Render 部署配置（Web 服务，数据库改为外部托管 Postgres）
# 关联 GitHub 仓库后，Render 会按此文件创建 Web 服务。
# 重要：不再使用 Render 自带的免费 Postgres（90 天无活动会删库）。
#       数据库改用 Neon / Supabase 等外部 Postgres，在下方 DATABASE_URL 填入连接串。
services:
  - type: web
    name: travel-account-online
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 部署时 Render 会提示你填写；或部署后在 Dashboard → Environment 手动填入。
      # 填入 Neon / Supabase 的 Postgres 连接串（形如 postgresql://user:pass@host/db?sslmode=require）
      - key: DATABASE_URL
        sync: false
